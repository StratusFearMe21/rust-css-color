[package]
name = "css-color"
version = "0.2.8"
authors = ["Kal Conley <kcconley@gmail.com>"]
edition = "2018"
description = "Rust library for CSS color strings"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/kalcutter/rust-css-color"
keywords = ["color", "colour", "css", "css4", "parser"]

[dev-dependencies]
regex = "1.7.1"
serde_json = "1.0"
miette = { version = "7.5.0", features = ["fancy"] }

[features]
bench = []
miette = ["dep:miette"]

[dependencies]
miette = { version = "7.5.0", optional = true }
thiserror = "2.0.11"

[[example]]
name = "parse_from_terminal"
required-features = ["miette"]
